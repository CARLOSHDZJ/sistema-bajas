<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nueva Solicitud - Sistema de Bajas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 shadow">
    <div class="container-fluid">
        <a class="navbar-brand animate__animated animate__fadeIn" href="/">🚚 SISTEMA DE RECOLECCION DE BAJAS</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto align-items-lg-center">
                <li class="nav-item my-1 my-lg-0">
                    <a href="/" class="btn btn-outline-light btn-sm me-lg-2 d-block text-center text-white">Volver al Inicio</a>
                </li>
                <li class="nav-item my-1 my-lg-0">
                    <a href="/cambiar_password" class="btn btn-outline-light btn-sm me-lg-2 d-block text-center text-white">
                        <i class="fa-solid fa-key"></i> Contraseña
                    </a>
                </li>
                <li class="nav-item my-1 my-lg-0">
                    <a href="/logout" class="btn btn-danger btn-sm shadow-sm d-block text-center">Salir</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-5">
    <div class="card shadow-lg">
        <div class="card-header bg-secondary text-white d-flex align-items-center">
            <h4 class="mb-0 fw-bold"><i class="fa-solid fa-circle-plus me-2"></i>Nueva Solicitud de Baja</h4>
        </div>
        <div class="card-body p-4">
            <form action="/nueva" method="post" enctype="multipart/form-data">
                
                <div class="row mb-3">
                    <div class="col-md-3">
                        <label class="form-label">Clave CT</label>
                        <input type="text" name="ct" class="form-control text-uppercase" placeholder="Ej: 20DTV0000X" required autofocus>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Fecha Recibido</label>
                        <input type="date" name="fecha_recibido" class="form-control" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Región</label>
                        <select name="region" class="form-select" required>
                            <option value="" disabled selected>Selecciona región...</option>
                            <option value="CAÑADA">CAÑADA</option>
                            <option value="COSTA">COSTA</option>
                            <option value="ISTMO">ISTMO</option>
                            <option value="MIXTECA">MIXTECA</option>
                            <option value="PAPALOAPAN">PAPALOAPAN</option>
                            <option value="SIERRA NORTE">SIERRA NORTE</option>
                            <option value="SIERRA SUR">SIERRA SUR</option>
                            <option value="VALLES">VALLES</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Cantidad Bienes</label>
                        <input type="number" name="cantidad_bienes" class="form-control" placeholder="0" required>
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-4">
                        <label class="form-label">Municipio</label>
                        <input type="text" name="municipio" class="form-control text-uppercase" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Localidad</label>
                        <input type="text" name="localidad" class="form-control text-uppercase" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Contacto (Tel)</label>
                        <input type="text" name="contacto" class="form-control text-uppercase" placeholder="10 DÍGITOS" required>
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label">Correo Electrónico</label>
                        <input type="email" name="correo" class="form-control text-uppercase" placeholder="ejemplo@correo.com">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Quién Recibió</label>
                        <input type="text" name="recibio" class="form-control text-uppercase" required>
                    </div>
                </div>

                <div class="row mb-3 bg-light p-3 rounded border mx-0">
                    <div class="col-md-3 d-flex align-items-center mb-2 mb-md-0">
                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox" name="en_bodega" value="si" id="enBodega">
                            <label class="form-check-label fw-bold" for="enBodega">📦 Copia en Bodega</label>
                        </div>
                    </div>
                    <div class="col-md-3 d-flex align-items-center mb-2 mb-md-0">
                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox" name="faltantes" value="si" id="faltantes">
                            <label class="form-check-label fw-bold text-danger" for="faltantes">⚠️ Hay Faltantes</label>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold text-primary">Expediente PDF</label>
                        <input type="file" name="expediente" class="form-control" accept=".pdf">
                    </div>
                </div>

                <div class="mb-4">
                    <div class="row">
                        <div class="col-md-4 mb-3 mb-md-0">
                            <label class="form-label">Tipo de Documento</label>
                            <select name="tipo_documento" class="form-select">
                                <option value="Original">Original</option>
                                <option value="Copia">Copia</option>
                            </select>
                        </div>
                        <div class="col-md-8">
                            <label class="form-label">Observaciones</label>
                            <textarea name="observaciones" class="form-control text-uppercase" rows="2" placeholder="Notas importantes de la recolección..."></textarea>
                        </div>
                    </div>
                </div>

                <div class="d-flex justify-content-between">
                    <a href="/" class="btn btn-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-dark px-4">💾 Guardar Solicitud</button>
                </div>

            </form>
        </div>
    </div>
</div>

<footer class="bg-dark text-white text-center py-3 mt-5 shadow-lg">
    <div class="container">
        <p class="mb-0 fw-bold">DEPARTAMENTO DE INVENTARIOS</p>
        <small class="text-white-50">Sistema de Recolección de Bajas • Departamento de Inventarios • Versión 1.0</small>
        <div class="mt-1">
            <small>© 2026 CHDZ</small>
        </div>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
document.querySelector('form').addEventListener('submit', async function(e) {
    e.preventDefault();
    const ctInput = document.querySelector('input[name="ct"]');
    const ct = ctInput.value.trim();
    if (!ct) {
        this.submit();
        return;
    }
    
    // Deshabilitar botón para evitar dobles envíos
    const submitBtn = this.querySelector('button[type="submit"]');
    const originalText = submitBtn.innerHTML;
    submitBtn.innerHTML = '⏳ Verificando...';
    submitBtn.disabled = true;

    try {
        const response = await fetch('/api/check_ct/' + encodeURIComponent(ct));
        const data = await response.json();
        
        if (data.existe) {
            const confirmar = confirm('⚠️ ATENCIÓN: Ya existe una solicitud registrada previamente para el CT: ' + ct + '.\n\n¿Estás seguro de que deseas registrar OTRA solicitud para este mismo Centro de Trabajo? (Puede ser un registro válido si son diferentes bienes o fechas)');
            if (confirmar) {
                this.submit();
            } else {
                // El usuario canceló, restaurar botón
                submitBtn.innerHTML = originalText;
                submitBtn.disabled = false;
                ctInput.focus();
            }
        } else {
            this.submit();
        }
    } catch (err) {
        console.error("Error comprobando CT:", err);
        this.submit(); // Si falla el check por red, permitir guardar
    }
});
</script>
</body>
</html>
