<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Reporte de Auditoría</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        @media print { .no-print { display: none; } }
        body { font-size: 12px; }
    </style>
</head>
<body onload="window.print()">
    <div class="container mt-4">
        <h3 class="text-center mb-4">REPORTE DE MOVIMIENTOS - SISTEMA DE BAJAS</h3>
        <table class="table table-bordered table-striped">
            <thead>
                <tr>
                    <th>Fecha y Hora</th>
                    <th>Usuario</th>
                    <th>Acción</th>
                    <th>Detalles</th>
                </tr>
            </thead>
            <tbody>
                {% for b in bitacora %}
                <tr>
                    <td>{{ b.fecha }}</td>
                    <td>{{ b.usuario }}</td>
                    <td>{{ b.accion }}</td>
                    <td>{{ b.detalles }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
